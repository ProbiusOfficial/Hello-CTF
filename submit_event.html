<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提交国内赛事 - Hello CTF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ProbiusOfficial/Hello-CTF/main/docs/assets/images/favicon.png">
<link rel="stylesheet" href="/shell/shell.css">
<script>
  if (localStorage.getItem('hc-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); line-height: 1.7;
    transition: background .25s, color .25s;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--hl); }

  .wrap { max-width: 1060px; margin: 0 auto; padding: 30px 32px 60px; }

  /* ===================== 渐变洗底容器（虚化无框，同首页 banner） ===================== */
  .stage {
    position: relative; margin-top: 20px;
    border-radius: 26px;
    background:
      radial-gradient(640px 320px at 92% -12%, rgba(37, 99, 235, .09), transparent 62%),
      radial-gradient(560px 300px at -6% 112%, rgba(34, 211, 238, .08), transparent 60%),
      var(--wash);
    padding: 44px 52px 40px;
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border-radius: 26px;
    background-image: radial-gradient(rgba(37, 99, 235, .14) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(115deg, transparent 30%, #000 90%);
    mask-image: linear-gradient(115deg, transparent 30%, #000 90%);
  }
  [data-theme="dark"] .stage::before { background-image: radial-gradient(rgba(96, 165, 250, .16) 1px, transparent 1px); }
  .stage > * { position: relative; }

  /* ===================== 页头 ===================== */
  .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--accent); }
  .page-head h1 {
    font-size: clamp(28px, 3vw, 38px);
    font-weight: 800; letter-spacing: -.03em; line-height: 1.2;
    margin: 8px 0 6px;
  }
  .page-head h1 .hl { background: linear-gradient(transparent 60%, var(--hl) 60%); }
  .page-head .sub { font-size: 13.5px; color: var(--ink-2); max-width: 560px; }

  /* ===================== 表单：两栏 ===================== */
  .form-grid {
    display: grid; grid-template-columns: 1.25fr 1fr; gap: 34px;
    margin-top: 26px;
  }
  .f-label {
    display: block; font-size: 13px; font-weight: 700; margin: 15px 0 6px;
  }
  .f-label:first-child { margin-top: 0; }
  .f-label .hint { font-weight: 400; font-size: 11.5px; color: var(--ink-3); }

  /* 无框输入：半透明底 + 底部柔线 */
  .f-input {
    width: 100%; font: inherit; font-size: 14px;
    border: none; border-bottom: 1.5px solid var(--line); border-radius: 10px 10px 0 0;
    background: color-mix(in srgb, var(--paper) 55%, transparent);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    color: var(--ink);
    padding: 9px 12px; outline: none;
    transition: border-color .15s, background .15s;
  }
  .f-input:focus { border-bottom-color: var(--accent); background: var(--paper); }
  .f-input::placeholder { color: var(--ink-3); }
  textarea.f-input { resize: none; height: 100%; min-height: 208px; border-radius: 10px; border: none; }

  /* ===================== 开始/结束 时间框 ===================== */
  .dt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dt-box {
    cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12.5px;
    border-bottom: 1.5px solid var(--line); border-radius: 10px 10px 0 0;
    background: color-mix(in srgb, var(--paper) 55%, transparent);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    padding: 9px 12px;
    transition: border-color .15s, background .15s;
  }
  .dt-box:hover, .dt-box.editing { border-bottom-color: var(--accent); background: var(--paper); }
  .dt-box .ic { width: 14px; height: 14px; color: var(--ink-3); flex: none; }
  .dt-box .ph { color: var(--ink-3); }
  .dt-box .cap { color: var(--ink-3); font-size: 11px; flex: none; }

  /* ===================== 日历弹层 ===================== */
  .dt-pop-wrap { position: relative; }
  .dp {
    position: absolute; top: 8px; left: 0; z-index: 60;
    width: 316px; max-width: 100%;
    padding: 14px 16px 12px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow-pop);
  }
  .dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .dp-title { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  .dp-title span { font-family: var(--mono); font-weight: 600; color: var(--ink-3); font-size: 11px; margin-left: 8px; }
  .dp-nav { display: flex; gap: 5px; }
  .dp-nav button {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink-2); cursor: pointer; font-family: var(--mono);
    display: flex; align-items: center; justify-content: center;
  }
  .dp-nav button:hover { border-color: var(--ink); color: var(--ink); }
  .dp-dow, .dp-days { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dp-dow span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; color: var(--ink-3); text-align: center; padding: 6px 0 4px; }
  .dp-day {
    font-family: var(--mono); font-size: 12px; text-align: center;
    padding: 5px 0; border: none; background: none; color: var(--ink);
    cursor: pointer; border-radius: 7px;
  }
  .dp-day:hover { background: var(--accent-soft); }
  .dp-day.blank { cursor: default; background: none; }
  .dp-day.today { color: var(--accent); font-weight: 700; }
  .dp-day.in-range { background: var(--accent-soft); border-radius: 0; }
  .dp-day.sel { background: var(--accent) !important; color: #fff; font-weight: 700; }
  .dp-foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
  }
  .dp-foot .cap { font-size: 11.5px; color: var(--ink-3); }
  .dp-foot select {
    font: inherit; font-family: var(--mono); font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink);
    padding: 3px 6px; outline: none; cursor: pointer;
  }
  .dp-foot select:focus { border-color: var(--accent); }
  .dp-done {
    margin-left: auto; width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    cursor: pointer; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .dp-done:hover { border-color: var(--accent); color: var(--accent); }

  /* ===================== 时长 chips ===================== */
  .quick { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .quick .q-cap { font-size: 11.5px; color: var(--ink-3); }
  .chip {
    font: inherit; font-size: 12px; font-family: var(--mono); cursor: pointer;
    border: none; border-radius: 999px; padding: 4px 13px;
    background: color-mix(in srgb, var(--paper) 65%, transparent);
    color: var(--ink-2);
    transition: background .15s, color .15s;
  }
  .chip:hover { color: var(--accent); background: var(--paper); }
  .chip.on { background: var(--accent); color: #fff; }

  .end-hint { font-size: 12px; color: var(--ink-3); margin-top: 8px; font-family: var(--mono); }
  .end-hint strong { color: var(--accent); font-weight: 600; }
  /* 时间待定开关 */
  .pending-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; font-size: 12.5px; color: var(--ink-2); cursor: pointer;
    user-select: none;
  }
  .pending-row input { accent-color: var(--accent); width: 14px; height: 14px; flex: none; }
  .dt-off .dt-row, .dt-off .quick, .dt-off .end-hint { opacity: .35; pointer-events: none; }

  /* ===================== 提交 ===================== */
  .f-actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .f-actions .btn { flex: none; white-space: nowrap; }
  #msg { flex: 1; font-size: 13px; min-height: 1.4em; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 12px 26px; border-radius: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; border: none;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .btn .ic { width: 16px; height: 16px; }
  .btn-dark { background: var(--ink); color: var(--paper); box-shadow: 0 12px 26px -12px rgba(15,23,42,.55); }
  .btn-dark:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn[disabled]:hover { transform: none; }
  #msg.ok { color: #15803d; }
  #msg.err { color: #dc2626; }
  [data-theme="dark"] #msg.ok { color: #4ade80; }
  [data-theme="dark"] #msg.err { color: #f87171; }
  .side-note { font-size: 12px; color: var(--ink-3); line-height: 1.8; margin-top: 12px; }
  .side-note a { color: var(--accent); text-decoration: underline; }

  @media (max-width: 860px) {
    .wrap { padding: 20px 16px 46px; }
    .stage { padding: 30px 24px; }
    .form-grid { grid-template-columns: 1fr; gap: 0; }
    textarea.f-input { min-height: 120px; }
  }
</style>
</head>
<body>
<div class="main">
  <div class="wrap">
    <div class="stage">

      <header class="page-head">
        <div>
          <div class="kicker">SUBMIT · 赛事提交</div>
          <h1>你办比赛，<span class="hl">我们帮你吆喝</span>。</h1>
          <p class="sub">填好下面几项点提交，我们每天都会看消息盒子，审核通过后比赛就会挂到赛事日历上。</p>
        </div>
      </header>

      <form id="f" autocomplete="off">
        <div class="form-grid">
          <div>
            <label class="f-label" for="name">比赛名称 <span class="hint">（必填）</span></label>
            <input class="f-input" id="name" name="name" type="text" required placeholder="例如：ExampleCTF 2026">

            <label class="f-label">比赛时间</label>
            <div class="dt-pop-wrap" id="dtWrap">
              <div class="dt-row">
                <div class="dt-box" id="stBox" data-mode="st">
                  <svg class="ic"><use href="#i-calendar"/></svg>
                  <span class="cap">开始</span>
                  <span id="stText" class="ph">选日期</span>
                </div>
                <div class="dt-box" id="etBox" data-mode="et">
                  <svg class="ic"><use href="#i-calendar"/></svg>
                  <span class="cap">结束</span>
                  <span id="etText" class="ph">选日期</span>
                </div>
              </div>
              <div class="dp" id="dpPop" hidden>
                <div class="dp-head">
                  <div class="dp-title" id="dpTitle"></div>
                  <div class="dp-nav">
                    <button type="button" id="dpPrev">‹</button>
                    <button type="button" id="dpNext">›</button>
                  </div>
                </div>
                <div class="dp-dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                <div class="dp-days" id="dpDays"></div>
                <div class="dp-foot">
                  <span class="cap" id="dpTimeCap">时间</span>
                  <select id="tpH"></select><span class="cap">:</span><select id="tpM"></select>
                  <button type="button" class="dp-done" id="dpDone" title="完成">✓</button>
                </div>
              </div>
            </div>
            <div class="quick" id="durChips">
              <span class="q-cap">或按时长：</span>
              <button type="button" class="chip" data-dur="3">3h</button>
              <button type="button" class="chip" data-dur="6">6h</button>
              <button type="button" class="chip" data-dur="9">9h</button>
              <button type="button" class="chip" data-dur="12">12h</button>
              <button type="button" class="chip" data-dur="24">24h</button>
              <button type="button" class="chip" data-dur="48">48h</button>
            </div>
            <div class="end-hint" id="endHint"></div>
            <label class="pending-row">
              <input type="checkbox" id="pendingChk">
              <span>时间待定（比赛已官宣，但具体时间还没公布）</span>
            </label>

            <label class="f-label" for="link">相关地址 <span class="hint">（必填，报名或比赛官网链接）</span></label>
            <input class="f-input" id="link" name="link" type="text" required placeholder="https://…">
          </div>

          <div style="display:flex; flex-direction:column;">
            <label class="f-label" for="detail">比赛描述 <span class="hint">（主办方、报名方式、交流群、赛制等，留空按 Jeopardy 记录）</span></label>
            <textarea class="f-input" id="detail" name="detail" placeholder="例如：&#10;主办方：某某战队&#10;QQ群：123456&#10;赛制：线上解题赛，个人参赛"></textarea>
            <div class="f-actions">
              <button type="button" class="btn btn-dark" id="btnPush">
                <svg class="ic"><use href="#i-calendar"/></svg>提交赛事
              </button>
              <p id="msg" role="status" aria-live="polite"></p>
            </div>
            <p class="side-note">通过后会出现在 <a href="/sidebar/events.html">赛事日历</a>；提交失败的话，去 <a href="/sidebar/feedback.html">反馈页</a> 或点右下角小喇叭告诉我们。</p>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="/shell/search.js"></script>
<script src="/shell/shell.js"></script>
<script>Shell.mount({ active: "submit" });</script>
<script>
(function () {
  /* 推送到 Hello-CTF 消息收集器（collector，管理面板从「消息盒子」拉取处理） */
  var PUSH_ENDPOINT = 'https://helloctfmsg.cyclens.tech/api/submit';

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, '0'); }

  function toCnFormat(d) {
    return d.getFullYear() + '年' + pad(d.getMonth() + 1) + '月' + pad(d.getDate()) +
      '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function setMsg(text, isOk) {
    var el = $('msg');
    el.className = isOk ? 'ok' : 'err';
    el.textContent = text;
  }

  /* ==================== 时间选择（开始/结束 双框 + 共享日历弹层） ==================== */
  var selStart = null, selEnd = null;          // Date（仅日期）
  var editing = 'st';                          // 弹层当前编辑哪一端
  var viewY, viewM;
  var popOpen = false;

  function todayDate() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  (function initView() { var t = todayDate(); viewY = t.getFullYear(); viewM = t.getMonth(); })();

  /* 时间下拉：时 00-23，分 00/15/30/45，默认 12:00 */
  (function fillTimeSelects() {
    var sH = $('tpH');
    for (var h = 0; h < 24; h++) {
      var o = document.createElement('option');
      o.value = o.textContent = pad(h);
      if (h === 12) o.selected = true;
      sH.appendChild(o);
    }
    ['00', '15', '30', '45'].forEach(function (m) {
      var o = document.createElement('option');
      o.value = o.textContent = m;
      $('tpM').appendChild(o);
    });
  })();

  /* 两端的时分分别缓存在 data 属性里，弹层里的下拉只是当前编辑端的视图 */
  var times = { st: { h: 12, m: 0 }, et: { h: 12, m: 0 } };

  function pullTimeFromPop() {
    times[editing].h = Number($('tpH').value);
    times[editing].m = Number($('tpM').value);
  }
  function pushTimeToPop() {
    $('tpH').value = pad(times[editing].h);
    $('tpM').value = pad(times[editing].m);
    $('dpTimeCap').textContent = editing === 'st' ? '开始时间' : '结束时间';
  }

  function startDateTime() {
    if (!selStart) return null;
    return new Date(selStart.getFullYear(), selStart.getMonth(), selStart.getDate(),
      times.st.h, times.st.m);
  }
  function endDateTime() {
    if (!selEnd) return null;
    return new Date(selEnd.getFullYear(), selEnd.getMonth(), selEnd.getDate(),
      times.et.h, times.et.m);
  }

  /* ---------- 弹层 ---------- */
  function openPop(mode) {
    if (popOpen && editing === mode) { closePop(); return; }
    if (popOpen) pullTimeFromPop();
    editing = mode;
    popOpen = true;
    $('dpPop').hidden = false;
    $('stBox').classList.toggle('editing', mode === 'st');
    $('etBox').classList.toggle('editing', mode === 'et');
    /* 视图跳到该端已选日期所在月 */
    var anchor = mode === 'st' ? selStart : selEnd;
    if (anchor) { viewY = anchor.getFullYear(); viewM = anchor.getMonth(); }
    pushTimeToPop();
    renderCalendar();
  }
  function closePop() {
    if (popOpen) pullTimeFromPop();
    popOpen = false;
    $('dpPop').hidden = true;
    $('stBox').classList.remove('editing');
    $('etBox').classList.remove('editing');
    refreshSummary();
  }
  $('stBox').onclick = function () { openPop('st'); };
  $('etBox').onclick = function () { openPop('et'); };
  $('dpDone').onclick = closePop;
  document.addEventListener('click', function (e) {
    if (popOpen && !e.target.closest('.dt-pop-wrap')) closePop();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && popOpen) closePop();
  });
  $('tpH').addEventListener('change', function () { pullTimeFromPop(); refreshSummary(); });
  $('tpM').addEventListener('change', function () { pullTimeFromPop(); refreshSummary(); });

  /* ---------- 日历 ---------- */
  function sameDay(a, b) {
    return a && b && a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function renderCalendar() {
    var first = new Date(viewY, viewM, 1);
    var startOffset = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(viewY, viewM + 1, 0).getDate();
    $('dpTitle').innerHTML = viewY + ' 年 ' + (viewM + 1) + ' 月<span>' +
      first.toLocaleString('en-US', { month: 'long' }).toUpperCase() + '</span>';
    var html = '';
    var total = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    var today = todayDate();
    for (var i = 0; i < total; i++) {
      var dNum = i - startOffset + 1;
      if (dNum < 1 || dNum > daysInMonth) {
        html += '<button type="button" class="dp-day blank" tabindex="-1"></button>';
        continue;
      }
      var d = new Date(viewY, viewM, dNum);
      var cls = 'dp-day';
      if (sameDay(d, today)) cls += ' today';
      if (selStart && selEnd && d > selStart && d < selEnd) cls += ' in-range';
      if (sameDay(d, selStart) || sameDay(d, selEnd)) cls += ' sel';
      html += '<button type="button" class="' + cls + '" data-day="' + dNum + '">' + dNum + '</button>';
    }
    $('dpDays').innerHTML = html;
    $('dpDays').querySelectorAll('[data-day]').forEach(function (b) {
      b.onclick = function () { pickDay(Number(b.dataset.day)); };
    });
  }

  function pickDay(dNum) {
    var d = new Date(viewY, viewM, dNum);
    if (editing === 'st') {
      selStart = d;
      /* 结束早于开始时，自动顺延 48h 兜底，免得马上报错 */
      if (selEnd && startDateTime() >= endDateTime()) {
        var e = new Date(startDateTime().getTime() + 48 * 3600 * 1000);
        selEnd = new Date(e.getFullYear(), e.getMonth(), e.getDate());
        times.et.h = e.getHours(); times.et.m = e.getMinutes();
      }
    } else {
      selEnd = d;
    }
    clearChips();
    renderCalendar();
    refreshSummary();
  }

  $('dpPrev').onclick = function () { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCalendar(); };
  $('dpNext').onclick = function () { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCalendar(); };

  /* ---------- 时长 chips ---------- */
  var chips = Array.prototype.slice.call(document.querySelectorAll('#durChips .chip'));
  function clearChips() { chips.forEach(function (c) { c.classList.remove('on'); }); }
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      var s = startDateTime();
      if (!s) { setMsg('请先选择比赛开始时间。', false); return; }
      clearChips();
      chip.classList.add('on');
      var e = new Date(s.getTime() + Number(chip.dataset.dur) * 3600 * 1000);
      selEnd = new Date(e.getFullYear(), e.getMonth(), e.getDate());
      times.et.h = e.getHours(); times.et.m = e.getMinutes();
      refreshSummary();
    });
  });

  /* ---------- 摘要与框内文字 ---------- */
  function fmtBox(d, t) {
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(t.h) + ':' + pad(t.m);
  }

  function refreshSummary() {
    $('stText').classList.toggle('ph', !selStart);
    $('stText').textContent = selStart ? fmtBox(selStart, times.st) : '选日期';
    $('etText').classList.toggle('ph', !selEnd);
    $('etText').textContent = selEnd ? fmtBox(selEnd, times.et) : '选日期';

    var s = startDateTime(), e = endDateTime();
    if (s && e) {
      var hours = Math.round((e - s) / 360000) / 10;
      $('endHint').innerHTML = e > s
        ? '<strong>' + toCnFormat(s) + '</strong> 至 <strong>' + toCnFormat(e) + '</strong>（共约 ' + hours + ' 小时）'
        : '<span style="color:#dc2626;">结束时间早于开始时间，请调整</span>';
    } else if (s) {
      $('endHint').innerHTML = '开始时间 <strong>' + toCnFormat(s) + '</strong>，请选择结束时间';
    } else {
      $('endHint').textContent = '';
    }
  }

  /* ---------- 时间待定开关 ---------- */
  $('pendingChk').addEventListener('change', function () {
    var off = this.checked;
    $('dtWrap').parentElement.classList.toggle('dt-off', off);
    if (off) {
      closePop();
      $('endHint').textContent = '';
      setMsg('已切换为时间待定，日期和时间都不用选。', true);
    } else {
      refreshSummary();
    }
  });

  /* ==================== 提交 ==================== */
  function getPayload() {
    var name = $('name').value.trim();
    var link = $('link').value.trim();
    var detail = $('detail').value.trim();
    if (!name || !link) throw new Error('请填写比赛名称和相关地址。');
    if ($('pendingChk').checked) {
      return { name: name, link: link, detail: detail, pending: true };
    }
    var s = startDateTime(), e = endDateTime();
    if (!s) throw new Error('请选择比赛开始时间。');
    if (!e) throw new Error('请选择比赛结束时间（或点击时长快捷选择）。');
    if (e <= s) throw new Error('结束时间早于开始时间，请检查。');
    return {
      name: name,
      link: link,
      comp_time_start: toCnFormat(s),
      comp_time_end: toCnFormat(e),
      detail: detail,
    };
  }

  $('btnPush').addEventListener('click', async function () {
    var btn = $('btnPush');
    var payload;
    try {
      payload = getPayload();
    } catch (e) {
      setMsg((e && e.message) || String(e), false);
      return;
    }
    btn.disabled = true;
    setMsg('正在提交…', true);
    try {
      var res = await fetch(PUSH_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'event', title: payload.name, content: payload }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setMsg('提交成功，审核通过后将显示在赛事日历上。', true);
    } catch (e) {
      setMsg('提交失败，请改用反馈页或右下角反馈按钮联系我们。', false);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
