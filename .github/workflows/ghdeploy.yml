name: Deploy to GitHub Pages and Automatically update
on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: gh-deploy
  cancel-in-progress: false

jobs:
  deploy_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 数据更新：只拉取赛事 JSON（docs/Event/json/）
      - name: Update event data
        run: python build.py

      # 只在赛事数据实际变化时提交，避免空 commit 刷屏
      - name: Commit event data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Event/json/ docs/Event/calendar/
          if git diff --cached --quiet; then
            echo "no event data changes, skip commit"
          else
            git commit -m "chore(events): update CTFtime data ($(date +%Y-%m-%d))"
            git push
          fi

      - name: Deploy MkDocs
        run: mkdocs gh-deploy --force
