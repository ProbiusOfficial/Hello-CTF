{% if page.meta and page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>

  <!-- giscus：主题与外壳 hc-theme 同步（初始 + 切换时 postMessage） -->
  <script src="https://giscus.app/client.js"
    data-repo="ProbiusOfficial/Hello-CTF"
    data-repo-id="R_kgDOJXX6hg"
    data-category="Show and tell"
    data-category-id="DIC_kwDOJXX6hs4CXmuV"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="light"
    data-lang="zh-CN"
    crossorigin="anonymous"
    async>
  </script>
  <script>
    (function () {
      var script = document.querySelector("script[src*=giscus]");
      function currentTheme() {
        var t = null;
        try { t = localStorage.getItem("hc-theme"); } catch (e) {}
        return t === "dark" ? "dark" : "light";
      }
      /* 初始主题：giscus 加载前写入 data-theme */
      script.setAttribute("data-theme", currentTheme());
      /* 外壳主题切换 → 通知 giscus iframe 换肤（由 shell.js 广播 hc-theme-change） */
      document.addEventListener("hc-theme-change", function (e) {
        var theme = e.detail === "dark" ? "dark" : "light";
        var iframe = document.querySelector("iframe.giscus-frame");
        if (iframe) {
          iframe.contentWindow.postMessage(
            { giscus: { setConfig: { theme: theme } } },
            "https://giscus.app"
          );
        }
      });
    })();
  </script>

  <!-- 评论区显示优化 -->
  <style>
    #__comments {
      margin-top: 2.2rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--line, #e6eaf1);
      font-size: 1rem;
    }
    .giscus, .giscus-frame { width: 100%; }
    .giscus-frame { border: none; color-scheme: light; }
    [data-md-color-scheme="slate"] .giscus-frame { color-scheme: dark; }
  </style>
{% endif %}
