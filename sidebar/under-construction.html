<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在施工 - Hello CTF</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.7; transition: background .25s, color .25s; }
  a { color: inherit; text-decoration: none; }
  .uc-wrap {
    min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;
    background:
      radial-gradient(640px 320px at 85% -10%, rgba(37, 99, 235, .08), transparent 62%),
      radial-gradient(520px 280px at 0% 110%, rgba(34, 211, 238, .07), transparent 60%);
  }
  .uc-box { text-align: center; max-width: 480px; }
  .uc-mono { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .14em; }
  .uc-mono .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .uc-title { font-size: clamp(34px, 5vw, 46px); font-weight: 800; letter-spacing: -.03em; margin: 18px 0 14px; }
  .uc-title .hl { background: linear-gradient(transparent 60%, var(--hl) 60%); }
  .uc-sub { font-size: 15px; color: var(--ink-2); margin-bottom: 30px; }
  .uc-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px; border-radius: 12px; font-size: 14.5px; font-weight: 700;
    transition: transform .16s, box-shadow .16s, border-color .16s;
  }
  .btn-dark { background: var(--ink); color: var(--paper); box-shadow: 0 12px 26px -12px rgba(15,23,42,.55); }
  .btn-dark:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop); }
  .btn-line { border: 1.5px solid var(--line); color: var(--ink); }
  .btn-line:hover { border-color: var(--ink); transform: translateY(-2px); }
  .uc-hint { margin-top: 26px; font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .uc-hint kbd {
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px;
    font-family: inherit; background: var(--wash);
  }
</style>
</head>
<body>
<script src="/shell/search.js"></script>
<script src="/shell/shell.js"></script>
<script>Shell.mount({ active: "teams" });</script>

<div class="main">
  <div class="uc-wrap">
    <div class="uc-box">
      <div class="uc-mono">$ make page &nbsp;# <span id="ucPct">37%</span> done<span class="cursor"></span></div>
      <div class="uc-title">这个页面<br><span class="hl">正在施工</span>。</div>
      <p class="uc-sub">我们正在把它搬到新的站点架构里，很快就能见面。<br>先去别处逛逛，或者回头再来看看。</p>
      <div class="uc-btns">
        <a class="btn btn-dark" href="/">返回首页</a>
        <a class="btn btn-line" href="/hc-start/">去看文档</a>
      </div>
      <div class="uc-hint">小技巧：<kbd>Ctrl</kbd> + <kbd>K</kbd> 可以全局搜索教程内容</div>
    </div>
  </div>
</div>
</body>
</html>
